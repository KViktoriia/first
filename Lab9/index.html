<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Моя друга гра</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://code.jquery.com/ui/1.13.2/jquery-ui.min.js"></script>
    <link rel="stylesheet" href="https://code.jquery.com/ui/1.13.2/themes/base/jquery-ui.css">
    
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background-color: #f9f9f9; }
        .hidden { display: none; }
        h1 { color: #d9534f; font-size: 48px; margin-top: 100px; }
        
        .btn {
            padding: 15px 30px; font-size: 20px; cursor: pointer;
            background-color: #5bc0de; color: white; border: none; border-radius: 5px;
        }

        #game-container { display: flex; justify-content: center; align-items: flex-start; gap: 50px; margin-top: 30px; }

        #grid {
            display: grid;
            grid-template-columns: repeat(5, 80px);
            grid-template-rows: repeat(5, 80px);
            gap: 5px;
            border: 2px solid #333;
            padding: 5px;
            background: white;
        }
        .cell { width: 80px; height: 80px; border: 1px solid #ccc; overflow: hidden; }
        .cell img { width: 100%; height: 100%; object-fit: cover; }

        #target-container {
            width: 150px; height: 150px; border: 2px solid #5bc0de;
            display: flex; align-items: center; justify-content: center;
            background: white; padding: 10px;
        }
        #target-img { width: 130px; height: 130px; cursor: grab; object-fit: cover; }
        #target-img.ui-draggable-dragging { z-index: 100; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }

        .category-select { margin-bottom: 20px; }
    </style>
</head>
<body>

    <div id="start-screen">
        <h1>Моя друга гра</h1>
        <div class="category-select">
            <label>Оберіть розділ: </label>
            <select id="category">
                <option value="animals">Тварини</option>
                <option value="insects">Комахи</option>
                <option value="fish">Риби</option>
            </select>
        </div>
        <button id="btn-start" class="btn">Почати гру</button>
    </div>

    <div id="game-screen" class="hidden">
        <div style="margin-top: 20px;">
            <button id="btn-restart" class="btn">Почати з початку</button>
        </div>

        <div id="game-container">
            <div id="grid"></div>

            <div>
                <p>Перетягніть цю картинку на збіг:</p>
                <div id="target-container">
                    <img id="target-img" src="" alt="Target">
                </div>
            </div>
        </div>
    </div>

   <script>
$(document).ready(function() {
    let currentCategory = 'animals';
    let gridImages = [];
    let targetImage = '';

    function getRandomImgPath(cat) {
        let num = Math.floor(Math.random() * 25) + 1;
        
        return `images/${cat}/${num}.jpg`;
    }

    function initGame() {
        currentCategory = $('#category').val();
        $('#start-screen').addClass('hidden');
        $('#game-screen').removeClass('hidden');
        generateGrid();
    }

    function generateGrid() {
        const grid = $('#grid');
        grid.empty();
        gridImages = [];

        for (let i = 0; i < 25; i++) {
            let imgPath = getRandomImgPath(currentCategory);
            gridImages.push(imgPath);
            
            let cell = $(`<div class="cell" data-id="${imgPath}"></div>`);
            let img = $(`<img src="${imgPath}">`);
            
            cell.append(img);
            grid.append(cell);

            cell.droppable({
                accept: "#target-img",
                tolerance: 'pointer',
                drop: function(event, ui) {
                    let droppedOnId = $(this).attr('data-id');
                    if (droppedOnId === targetImage) {
                        alert("Вірно!");
                        setNewTarget();
                    } else {
                        alert("Не вірно!");
                    }
                }
            });
        }
        setNewTarget();
    }

    function setNewTarget() {
    targetImage = gridImages[Math.floor(Math.random() * gridImages.length)];
    $('#target-img').attr('src', targetImage);

    $('#target-img').draggable({
        revert: "invalid",
        containment: "body", 
        cursor: "move",
        helper: function() {
            return $(this).clone().css({
                'width': '80px',
                'height': '80px',
                'z-index': 1000
            }).appendTo('body');
        },
        cursorAt: { top: 40, left: 40 }
    });
}

    $('#btn-start').click(initGame);
    $('#btn-restart').click(function() {
        location.reload();
    });
});
</script>
</body>
</html>
